name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag and ancestry
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use stable SemVer, for example v1.0.0." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: intl, mbstring
          coverage: none
          tools: composer:v2

      - name: Validate and test PHP
        run: |
          composer validate --strict --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          composer test:unit

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Build and verify JavaScript
        run: |
          npm ci --prefix js
          npm run build --prefix js
          git diff --exit-code -- js/dist

      - name: Build release archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          asset="flarum-enhanced-search-${version}.zip"
          git archive \
            --format=zip \
            --prefix='flarum-enhanced-search/' \
            --output="dist/${asset}" \
            "$GITHUB_SHA" -- \
            composer.json extend.php LICENSE.md README.md CHANGELOG.md \
            src migrations resources js/dist
          (
            cd dist
            sha256sum "$asset" > "${asset}.sha256"
          )
          unzip -t "dist/${asset}"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/${{ steps.package.outputs.asset }}
            dist/${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}
          path: dist

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --generate-notes \
              --title "Enhanced Search ${RELEASE_TAG}"
          fi
