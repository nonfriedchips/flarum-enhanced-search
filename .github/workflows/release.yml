name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag and ancestry
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use stable SemVer, for example v1.0.0." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: intl, mbstring
          coverage: none
          tools: composer:v2

      - name: Validate and test PHP
        run: |
          composer validate --strict --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          composer test:unit

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Build and verify JavaScript
        run: |
          npm ci --prefix js
          npm run build --prefix js
          git diff --exit-code -- js/dist

      - name: Build release archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          asset="flarum-enhanced-search-${version}.zip"
          git archive \
            --format=zip \
            --prefix='flarum-enhanced-search/' \
            --output="dist/${asset}" \
            "$GITHUB_SHA" -- \
            composer.json extend.php LICENSE.md README.md CHANGELOG.md \
            src migrations resources js/dist
          (
            cd dist
            sha256sum "$asset" > "${asset}.sha256"
          )
          unzip -t "dist/${asset}"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/${{ steps.package.outputs.asset }}
            dist/${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error
          retention-days: 7

  database:
    name: Database · ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: MySQL 8.4
            image: mysql:8.4
            family: mysql
            health_command: mysqladmin ping --protocol=tcp -h127.0.0.1 -uroot -penhanced_search_root --silent
          - label: MariaDB 10.11
            image: mariadb:10.11
            family: mariadb
            health_command: healthcheck.sh --connect --innodb_initialized
          - label: MariaDB 11.8
            image: mariadb:11.8
            family: mariadb
            health_command: healthcheck.sh --connect --innodb_initialized

    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: enhanced_search_root
          MYSQL_DATABASE: flarum_test
          MYSQL_USER: flarum
          MYSQL_PASSWORD: flarum_test_password
          MARIADB_ROOT_PASSWORD: enhanced_search_root
          MARIADB_DATABASE: flarum_test
          MARIADB_USER: flarum
          MARIADB_PASSWORD: flarum_test_password
        ports:
          - 33311:3306
        options: >-
          --health-cmd="${{ matrix.health_command }}"
          --health-start-period=20s
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install extension dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Verify database FULLTEXT contract
        env:
          ENHANCED_SEARCH_DB_HOST: 127.0.0.1
          ENHANCED_SEARCH_DB_PORT: 33311
          ENHANCED_SEARCH_DB_DATABASE: flarum_test
          ENHANCED_SEARCH_DB_USERNAME: flarum
          ENHANCED_SEARCH_DB_PASSWORD: flarum_test_password
          ENHANCED_SEARCH_EXPECTED_DATABASE: ${{ matrix.family }}
        run: composer test:database

      - name: Install Flarum 1.8 with Enhanced Search
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/flarum"
          composer create-project flarum/flarum:^1.8.0 "$site" \
            --no-interaction --no-progress --prefer-dist
          composer --working-dir="$site" \
            config repositories.enhanced-search path "$GITHUB_WORKSPACE"
          composer --working-dir="$site" require \
            nonfriedchips/flarum-enhanced-search:@dev \
            --with-all-dependencies --no-interaction --no-progress
          cd "$site"
          php -d error_reporting=22527 flarum install \
            -f "$GITHUB_WORKSPACE/tests/fixtures/install.json"
          php -d error_reporting=22527 flarum extension:enable \
            nonfriedchips-enhanced-search

      - name: Run Flarum migration and search integration tests
        env:
          FLARUM_ROOT: ${{ runner.temp }}/flarum
          ENHANCED_SEARCH_EXPECTED_DATABASE: ${{ matrix.family }}
        run: |
          php -d error_reporting=22527 tests/boot-smoke.php
          php -d error_reporting=22527 tests/integration.php

  publish:
    name: Publish GitHub Release
    needs:
      - build
      - database
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}
          path: dist

      - name: Verify downloaded release bundle
        working-directory: dist
        run: sha256sum -c *.sha256

      - name: Create and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if release_state="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$release_state" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published; refusing to replace its assets." >&2
              exit 1
            fi

            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "Enhanced Search ${RELEASE_TAG}"
          fi

          gh release edit "$RELEASE_TAG" --draft=false --latest
